# FreeVelo server with HTTPS (Caddy + Let's Encrypt). See docs/ORACLE.md.
#   cp .env.example .env    # set FREEVELO_DOMAIN
#   docker compose up -d --build
services:
  freevelo:
    build:
      context: ..
      dockerfile: src/FreeVelo.Server/Dockerfile
    restart: unless-stopped
    environment:
      # Caddy is another container: trust its X-Forwarded-For (port 8080 is not published).
      Server__BehindProxy: "true"
    volumes:
      - freevelo-data:/data
    expose:
      - "8080"

  caddy:
    image: caddy:2
    restart: unless-stopped
    depends_on:
      - freevelo
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    environment:
      FREEVELO_DOMAIN: ${FREEVELO_DOMAIN:?Set FREEVELO_DOMAIN in deploy/.env}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config

volumes:
  freevelo-data:
  caddy-data:
  caddy-config:
