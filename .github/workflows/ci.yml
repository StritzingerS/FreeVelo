name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  dotnet:
    name: C# libraries
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: "10.0.x"
      - name: Build and test
        run: dotnet test FreeVelo.slnx --configuration Release

  android:
    name: Android BLE test app
    runs-on: ubuntu-latest
    permissions:
      contents: write # publish the test APK as a pre-release
    concurrency:
      group: ble-test-release
    defaults:
      run:
        working-directory: android
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v6
      - name: Unit tests and APK
        run: ./gradlew --no-daemon :ble:testDebugUnitTest :testapp:testDebugUnitTest :testapp:assembleDebug :ble:assembleRelease

      - name: Prepare APK
        run: |
          mkdir -p out
          cp testapp/build/outputs/apk/debug/testapp-debug.apk out/FreeVelo-BleTest.apk

      - uses: actions/upload-artifact@v7
        with:
          name: FreeVelo-BleTest-${{ github.run_number }}
          path: android/out/FreeVelo-BleTest.apk
          retention-days: 30

      # Rolling pre-release with a fixed download link:
      # https://github.com/StritzingerS/FreeVelo/releases/download/ble-test-latest/FreeVelo-BleTest.apk
      - name: Publish pre-release "ble-test-latest"
        if: github.event_name != 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete ble-test-latest --yes --cleanup-tag || true
          gh release create ble-test-latest out/FreeVelo-BleTest.apk \
            --prerelease \
            --target "$GITHUB_SHA" \
            --title "BLE Test App – build ${GITHUB_RUN_NUMBER}" \
            --notes "Debug build ${GITHUB_RUN_NUMBER} of the FreeVelo BLE test app from \`${GITHUB_REF_NAME}\` (${GITHUB_SHA::7}). Not for general use. Install guide: docs/TESTING.md"

      # Bluetooth library for Unity (downloaded by the Unity editor script FreeVeloAndroidPlugins):
      # https://github.com/StritzingerS/FreeVelo/releases/download/ble-android-latest/freevelo-ble.aar
      - name: Publish Unity BLE plugin "ble-android-latest"
        if: github.event_name != 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp ble/build/outputs/aar/ble-release.aar out/freevelo-ble.aar
          gh release delete ble-android-latest --yes --cleanup-tag || true
          gh release create ble-android-latest out/freevelo-ble.aar \
            --prerelease \
            --target "$GITHUB_SHA" \
            --title "Android BLE plugin for Unity – build ${GITHUB_RUN_NUMBER}" \
            --notes "freevelo-ble.aar from \`${GITHUB_REF_NAME}\` (${GITHUB_SHA::7}). Downloaded automatically by the Unity project (menu FreeVelo → Update Android plugins)."
